---
- name: Set timezone
  community.general.timezone:
    name: "{{ baseline_timezone }}"

- name: Ensure unattended-upgrades is installed
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Harden sshd - disable root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
  when: baseline_disable_root_login
  notify: restart sshd

- name: Harden sshd - disable password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
  when: baseline_disable_password_auth
  notify: restart sshd

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Ensure fail2ban is enabled and running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Set UFW default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    port: "{{ baseline_ssh_port }}"
    proto: tcp

- name: Allow additional baseline ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ baseline_allowed_ports }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled
